<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" fill="none" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">AIAI Logo</title>
  <desc id="desc">Pixel-art mark for AIAI CLI: rotated 90 degrees clockwise (1:1 square)</desc>
  <style>
    :root {
      --aiai-fg: #FFFFFF;
      --aiai-accent: #FF3B30;
      --aiai-bg: transparent;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --aiai-fg: #18181B;
      }
    }

    /* Explicit theme overrides */
    svg.light, .light .aiai-fg {
      --aiai-fg: #18181B;
    }

    svg.dark, .dark .aiai-fg {
      --aiai-fg: #FFFFFF;
    }

    .aiai-bg {
      fill: var(--aiai-bg, transparent);
    }

    .aiai-fg {
      fill: var(--aiai-fg, #FFFFFF);
    }

    .aiai-accent {
      fill: var(--aiai-accent, #FF3B30);
    }

    @media (prefers-color-scheme: light) {
      .aiai-fg {
        fill: var(--aiai-fg, #18181B);
      }
    }
  </style>

  <rect class="aiai-bg" width="100%" height="100%" fill="none"/>

  <!-- Rotated 'A' (Prompt chevron pointing right) -->
  <path id="aiai-prompt" class="aiai-fg" d="M217 98h14v28h-14z M203 84h14v56h-14z M175 70h28v84h-28z M147 63h28v42h-28z M147 119h28v42h-28z M133 56h14v42h-14z M133 126h14v42h-14z M105 42h28v42h-28z M105 140h28v42h-28z M91 28h14v42h-14z M91 154h14v42h-14z M63 21h28v42h-28z M63 161h28v35h-28z M49 14h14v42h-14z M49 168h14v28h-14z "/>

  <!-- Rotated Red mark (Horizontal stem + two vertical bars) -->
  <path id="aiai-accent" class="aiai-accent" d="M217 210h14v56h-14z M189 210h14v56h-14z M49 210h126v56h-126z "/>
</svg>
