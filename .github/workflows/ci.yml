name: CI
on:
  workflow_dispatch:
  # push:
  # pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go build -trimpath -o bin/ ./cmd/aiai
      - run: go run ./cmd/aiai version --json
      - run: go run ./cmd/aiai init python smoke-project --target "${{ runner.temp }}/aiai-smoke" --yes --json
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Check formatting (goimports and gofumpt)
        run: ./scripts/fmt.sh --check
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
  python-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go run ./cmd/aiai init python example-project --target "${{ runner.temp }}/aiai-python" --yes
      - name: Verify generated project and Git hooks
        working-directory: ${{ runner.temp }}/aiai-python
        run: |
          git init
          corepack enable
          pnpm install
          uv lock
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
          uv run --locked pytest
          test "$(git config core.hooksPath)" = '.husky/_'
          sh .husky/_/pre-commit
